name: libgui demo

on: [push, pull_request]

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  build:
    name: Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["Wii", "GameCube", "WiiU"]
    container: ghcr.io/extremscorner/libogc2:latest

    steps:
    - name: Checkout libgui repo
      uses: actions/checkout@v4

    - name: Install Wii U dependencies
      if: ${{ matrix.image == 'WiiU' }}
      run: dkp-pacman -Syu --noconfirm wiiu-dev

    - name: Install Ninja build tool
      run: dkp-pacman -S --noconfirm ninja

    - name: Build and install libmocha
      if: ${{ matrix.image == 'WiiU' }}
      run: |
        git clone --depth 1 https://github.com/dborth/libmocha.git /tmp/libmocha
        cd /tmp/libmocha && make install

    - name: Build and install libdvm
      if: ${{ matrix.image == 'WiiU' }}
      run: |
        git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/dborth/libdvm.git /tmp/libdvm
        cd /tmp/libdvm && make install

    - name: Build and install libsmb2
      run: |
        git clone --depth 1 https://github.com/dborth/libsmb2.git /tmp/libsmb2
        cd /tmp/libsmb2
        if [ "${{ matrix.image }}" = "Wii" ]; then
          make -f Makefile.platform wii_install
        elif [ "${{ matrix.image }}" = "GameCube" ]; then
          make -f Makefile.platform gc_install
        elif [ "${{ matrix.image }}" = "WiiU" ]; then
          make -f Makefile.platform wiiu_install
        fi

    - name: Build Wii
      if: ${{ matrix.image == 'Wii' }}
      run: make -f Makefile.wii -j3

    - name: Build GameCube
      if: ${{ matrix.image == 'GameCube' }}
      run: make -f Makefile.gc -j3

    - name: Build Wii U
      if: ${{ matrix.image == 'WiiU' }}
      run: make -f Makefile.wiiu -j3

    - name: Upload binary artifact (Wii & GameCube)
      if: ${{ matrix.image == 'Wii' || matrix.image == 'GameCube' }}
      uses: actions/upload-artifact@v4
      with:
        name: libgui-${{ matrix.image }}
        path: "*.dol"

    - name: Upload binary artifact (Wii U)
      if: ${{ matrix.image == 'WiiU' }}
      uses: actions/upload-artifact@v4
      with:
        name: libgui-${{ matrix.image }}
        path: |
          *.rpx
          *.wuhb

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout libgui repo
      uses: actions/checkout@v4

    - name: Update documentation
      uses: mattnotmitt/doxygen-action@v1.9.5
      with:
        working-directory: '.'
        doxyfile-path: './Doxyfile'

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload documentation artifacts
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Checkout libgui repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: libgui-*
        merge-multiple: true

    - name: Re-zip artifact
      run: |
        cd dist
        zip -r libgui.zip .

    - name: Update Git Tag
      run: |
        git tag -f Pre-release
        git push -f origin Pre-release

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        prerelease: true
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: false
        tag: Pre-release
        artifacts: "dist/libgui.zip"
